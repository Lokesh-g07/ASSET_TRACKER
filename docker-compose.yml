services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  hub:
    build:
      context: ./hub
    container_name: hub
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - FIREBASE_CREDENTIALS_PATH=/secrets/firebase-adminsdk.json
      - FIREBASE_DATABASE_URL=${VITE_FIREBASE_DATABASE_URL:-}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  simulator:
    build:
      context: ./simulator
    container_name: simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_ENABLED=true
    depends_on:
      mosquitto:
        condition: service_healthy
